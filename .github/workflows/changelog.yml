name: Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-changelog:
    # Skip when the push is the bot's own changelog commit, to avoid an
    # infinite loop of the workflow triggering itself.
    if: "!contains(github.event.head_commit.message, 'chore(changelog): update CHANGELOG.md')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore(changelog): update CHANGELOG.md"
            git push
          else
            echo "No changelog changes to commit."
          fi
